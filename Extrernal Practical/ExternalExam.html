<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding: 40px; background: #fff5f5; }
        .box { background: rgb(255, 255, 255); padding: 25px; border-radius: 8px; border: 1px solid #aa4c4c; text-align: center; }
        button { background: #974848; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <h3>Factorial Calculator</h3>
        <input type="number" id="factNum" placeholder="Enter a number">
        <button onclick="calcFactorial()">Calculate</button>
        <p id="res5" style="font-weight: bold; font-size: 1.2em;"></p>
    </div>

    <script>
        function calcFactorial() {
            let n = parseInt(document.getElementById('factNum').value);
            if (n < 0) {
                document.getElementById('res5').innerText = "Please enter a positive number.";
                return;
            }
            let fact = 1;
            for (let i = 1; i <= n; i++) {
                fact *= i;
            }
            
            document.getElementById('res5').innerText = n + "! = " + fact;
        }
    </script>
</body>
</html>
